<!DOCTYPE html>
<!--
=====================================================================
  YANTRIKA WEBSITE : QUICK EDIT GUIDE
=====================================================================
  This is a single-page site. Everything lives in this one file:

    1. <style>  ... </style>   -> all the look & feel (colours, spacing)
    2. <script> ... </script>  -> all the content + page logic
         DATA (edit these most often)
           EV      events list            (add/edit an event)
           MAT     materials / downloads  (add a PDF, attach it to an event)
           TEAM    team members
           LINKS   email, website, Instagram, LinkedIn
           DON     donation UPI id + QR image
           G       home-page photo gallery images
           JAM     Game Jam contest on the home page (status, perks, links)
           INDP    Independent Projects page (listed projects, form link)
           WALL    Game Jam "Wall of Fame" (contributors)
           PIL     the four pillars (Learn / Build / Compete / Share)
           (the games are NOT in this file any more: see games/ below)
         PAGE TEMPLATES
           V = { home, about, games, events, materials, team, join, donate }
           Each one is the HTML of one page. Edit the text inside.
         GAMES  (open source, one folder per game)
           games/<id>/game.js   the game, its theory text, demo and events
           games/manifest.js    which games are shown, and in what order
           games/core.js        the small shared toolkit games can use
           games/README.md      how to add or change a game
         ROUTER
           function r() at the very bottom: draws nav + current page.
  COMMON JOBS
    * Change an event's text/date ......... EV  (search:  const EV)
    * Add a new event ..................... copy one line in EV, give it a
                                            unique id. Status s: 'done' |
                                            'plan' | 'prop'
    * Add a file to an event page ......... put the PDF in /materials, add a
                                            line in MAT with  ev:['event-id']
    * Add a team member ................... TEAM  (search:  const TEAM)
    * Change colours ...................... :root{...} at top of <style>
    * Change the header logo text ......... function r() -> nav innerHTML
    * Change the donate UPI id ............ DON
    * Add or fix a game ................... games/README.md  (CONTRIBUTING.md)
    * Run / close the Game Jam ............ JAM.status, add winners to WALL

  FOLDERS THE PAGE EXPECTS (next to this file)
    images/      photos, game thumbnails, logos
    posters/     one poster per upcoming event:  posters/<event-id>.png
    materials/   the PDF files listed in MAT
  Also loaded: games/ (core.js, manifest.js, games.css), animations.css, bg-slider.css,
  games-phone-fix.css, sitemap.js

  TIP: after editing, open the file in a browser and press Ctrl+F5.
  TIP: in JS strings use \' for an apostrophe, or wrap text in "double quotes".
=====================================================================
-->

<!-- ======================= STYLES (CSS) ======================= -->
<style>
/* ===================== CSS: THEME (change colours here) =====================
   --red/--yel/--cy/--bl/--or/--pk are the brand colours,
   --bg page background, --card card background, --ink text, --dk borders/shadows. */
:root{--red:#ec3750;--yel:#f1c40f;--cy:#33d6a6;--bl:#338eda;--or:#ff8c37;--pk:#ff5a5f;--dk:#17171d;--bg:#f9f9f9;--card:#fff;--ink:#17171d;--soft:#f1f1f1;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
/* Dark mode: automatic (follows the device) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101015;--card:#1e1e26;--ink:#f4f4f4;--soft:#2a2a34;--dk:#000}}
/* Dark mode: when the user presses the theme button */
:root[data-theme="dark"]{--bg:#101015;--card:#1e1e26;--ink:#f4f4f4;--soft:#2a2a34;--dk:#000}
/* ===================== CSS: BASE ===================== */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);background-image:radial-gradient(rgba(128,128,128,.45) 1px,transparent 1px);background-size:24px 24px;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);margin:0;line-height:1.6;position:relative;overflow-x:hidden}
.c{max-width:980px;margin:0 auto;padding:0 20px 40px;position:relative;z-index:1}
.m{font-family:'Permanent Marker',cursive,sans-serif}
h1,h2,h3{margin-top:0}a{color:inherit}
/* background photo gallery (home only) */
/* ===================== CSS: HOME HERO ===================== */
.bgal{position:absolute;top:0;left:0;right:0;height:720px;z-index:0;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:8px;box-sizing:border-box;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%);mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 95%)}
.bgal .gt{border:3px solid var(--dk);border-radius:10px;overflow:hidden;opacity:.8;min-height:0}
.bgal img{width:100%;height:100%;object-fit:cover;display:block}
.hero2{min-height:520px;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:50px}
.hero2 .txt{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg) 92%,transparent) 35%,transparent 72%);padding:40px 50px}
.ytitle{font-size:clamp(3.5rem,13vw,8.5rem);line-height:1;color:var(--red);text-shadow:5px 5px 0 var(--dk);margin:0 0 14px}
.ytitle img{display:block;margin:0 auto;width:min(100%,640px);height:auto}
.hero2 h2{font-size:clamp(1.5rem,4vw,2.4rem);margin-bottom:6px}
/* ===================== CSS: TOP NAV BAR ===================== */
nav{position:sticky;top:0;z-index:9;background:var(--yel);border-bottom:4px solid var(--dk);margin:0 0 36px;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,calc(50vw - 600px)) 8px;display:flex;flex-wrap:nowrap;gap:12px;align-items:center;box-sizing:border-box}
nav .logo{font-size:1.85rem;line-height:1.2;color:#17171d;text-decoration:none;margin-right:auto;display:flex;align-items:center;white-space:nowrap;flex:0 0 auto}
.logo img{display:block;height:44px;width:auto;max-width:100%}
nav .nl{display:flex;flex-wrap:nowrap;align-items:center;gap:2px}
nav a.l{color:#17171d;font-weight:700;font-size:1.1rem;text-decoration:none;padding:3px 9px;border:3px solid transparent;border-radius:8px;white-space:nowrap}
nav a.l:hover,nav a.l.on{border-color:var(--dk);background:#fff}
nav #th{flex:0 0 auto;padding:3px 11px;box-shadow:3px 3px 0 var(--dk)}
nav #mb{display:none;flex:0 0 auto;margin:0;padding:3px 11px;font-size:1.15rem;line-height:1.3;box-shadow:3px 3px 0 var(--dk)}
/* Narrow screens: links fold into a dropdown so the bar always stays ONE row */
@media(max-width:1180px){
 nav #mb{display:inline-block}
 nav .nl{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;background:var(--yel);border-bottom:4px solid var(--dk);padding:10px max(16px,calc(50vw - 600px)) 14px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
 nav .nl.open{display:flex}
 nav .nl a.l{font-size:1.25rem;padding:8px 12px}
}
/* ===================== CSS: CARDS, BUTTONS, BADGES, GRIDS ===================== */
/* .card big content block | .box small tile | .btn button | .badge status pill | .grid auto columns */
.card{border:4px solid var(--dk);border-radius:12px;box-shadow:8px 8px 0 var(--dk);padding:28px;margin-bottom:36px;background:var(--card)}
.tag{display:inline-block;background:var(--yel);color:#17171d;padding:5px 15px;border:2px solid var(--dk);border-radius:20px;font-weight:700;margin:5px}
.btn{display:inline-block;background:var(--yel);color:#17171d;border:3px solid var(--dk);border-radius:8px;padding:6px 14px;font:inherit;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--dk);cursor:pointer;margin:4px 6px 4px 0}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--dk)}
.btn.cy{background:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.box{border:3px solid var(--dk);border-radius:10px;box-shadow:5px 5px 0 var(--dk);padding:18px;background:var(--card);transition:transform .15s ease}
.box:hover{transform:translate(-3px,-3px)}
.badge{display:inline-block;border:2px solid var(--dk);border-radius:20px;padding:1px 12px;font-weight:700;font-size:.82rem;color:#17171d}
/* Status badge colours: Completed / Upcoming / Coming soon */
.done{background:var(--cy)}.plan{background:var(--yel)}.prop{background:var(--or)}
/* Timeline on the home page ("Where we are now") */
.tl{border-left:6px solid var(--dk);padding-left:20px;margin-left:20px}
.ti{position:relative;padding:10px;margin-bottom:8px;border-radius:8px}
.ti:hover{background:var(--yel);color:#17171d}
.ti::before{content:'';position:absolute;left:-36px;top:16px;width:20px;height:20px;background:var(--or);border:3px solid var(--dk);border-radius:50%}
.stat{text-align:center}.stat b{display:block;font-size:2.4rem;font-family:'Permanent Marker',cursive}
.band{background:var(--cy);color:#17171d;text-align:center}
.foot{background:var(--yel);color:#17171d;text-align:center;font-weight:700}
.pill{display:inline-flex;margin:4px;padding:8px 16px;border:3px solid var(--dk);border-radius:20px;background:var(--yel);color:#17171d;font-weight:700}
#q{width:100%;max-width:420px;border:3px solid var(--dk);border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--dk);margin-bottom:16px}
input,textarea{font:inherit}
/* Event pages: photo gallery + poster */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.gal img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid var(--dk);border-radius:8px;box-sizing:border-box}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:var(--soft);border-style:dashed;font-size:.85rem}
.poster{aspect-ratio:3/4;border:4px solid var(--dk);border-radius:8px;box-shadow:6px 6px 0 var(--dk);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-sizing:border-box;max-width:420px}
.poster img{width:100%;height:100%;object-fit:cover}
.poster.has{padding:0;overflow:hidden}
.poster h2{font-size:2rem;text-shadow:3px 3px 0 var(--dk);margin:0}
a.ev{text-decoration:none;}
.join-fab{position:fixed;right:18px;bottom:18px;z-index:50;background:#FFEF02;color:#17171d;border:3px solid #17171d;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 #17171d}
.join-fab:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #17171d}
.upi{font-size:1.3rem;word-break:break-all;background:var(--soft);border:3px dashed var(--dk);border-radius:8px;padding:10px 14px;margin:10px 0;font-weight:700}
/* Phone layout tweaks for the basics above */
@media(max-width:600px){.c{padding-left:14px;padding-right:14px}nav{padding-left:14px;padding-right:14px}.card{padding:20px}nav .logo{font-size:1.6rem}.logo img{height:38px}.bgal{height:560px}.hero2{min-height:420px}.hero2 .txt{padding:30px 10px}}

/*CSS part*/
/* Home: photo slider + promo video + "come build with us" banner */
.slider{overflow:hidden;margin:20px -28px;padding:6px 0;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:slide 45s linear infinite}
.slider:hover .track{animation-play-state:paused}
.sl{flex:0 0 auto;width:240px;aspect-ratio:4/3;margin-right:14px;border:3px solid var(--dk);border-radius:10px;overflow:hidden;box-shadow:4px 4px 0 var(--dk)}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes slide{to{transform:translateX(-50%)}}
@media(max-width:600px){.slider{margin-left:-20px;margin-right:-20px}.sl{width:180px}}
@media(prefers-reduced-motion:reduce){.track{animation:none}.slider{overflow-x:auto}}
.vid{position:relative;border:4px solid var(--dk);border-radius:20px;box-shadow:8px 8px 0 var(--dk);overflow:hidden;background:#000;margin:0 0 40px;line-height:0}
.vid video{width:100%;display:block;max-height:80vh;background:#000}
.vid .btn{position:absolute;right:14px;bottom:14px;margin:0;line-height:1.4}
.cta{position:relative;margin:0 0 36px;min-height:320px;display:flex;align-items:center}
.cta .slider{margin:0 -20px;width:calc(100% + 40px)}
.cta .sl{width:300px}
.cta .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;pointer-events:none;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg) 88%,transparent) 30%,transparent 70%)}
.cta .ov h2{font-size:clamp(2rem,7vw,4.5rem);color:var(--red);text-shadow:4px 4px 0 var(--dk);margin:0 0 6px}
.cta .ov p{font-weight:700;margin:0 0 10px}
.cta .ov .btn{pointer-events:auto}
@media(max-width:600px){.cta .slider{margin:0 -14px;width:calc(100% + 28px)}.cta .sl{width:200px}.cta{min-height:260px}}
/*CSS part end*/

/* Independent Projects submission form */
.fm form{display:grid;gap:14px;max-width:620px}
.fm label{display:grid;gap:4px;font-weight:700}
.fm input:not([type=checkbox]),.fm select,.fm textarea{border:3px solid var(--dk);border-radius:8px;padding:9px 12px;font:inherit;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.fm input:focus-visible,.fm select:focus-visible,.fm textarea:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.fm .ck{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.fm .ck input{width:22px;height:22px;margin-top:3px;flex:0 0 auto}
.fm .bad{border-color:var(--red)!important}
.fm form .btn{justify-self:start}
#indp-st{margin:0;font-weight:700}

/* Game Jam (home page contest) */
.jam{background:#17171d;color:#f4f4f4;position:relative;overflow:hidden;background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 2px,transparent 2px 4px)}
.jam h2{color:var(--yel);text-shadow:3px 3px 0 var(--red);font-size:clamp(1.8rem,5vw,3rem)}
.jam a:not(.btn){color:var(--cy)}
.jam-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.jam-blink{font-family:'Permanent Marker',cursive;color:var(--red);font-size:1.2rem;animation:jamb 1s steps(2) infinite}
@keyframes jamb{50%{opacity:0}}
.jam-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0}
.jam-steps div{border:3px solid var(--yel);border-radius:10px;padding:12px;background:rgba(255,255,255,.05)}
.jam-steps b{display:block;color:var(--yel);font-size:1.6rem;font-family:'Permanent Marker',cursive}
.jam-wall{display:flex;flex-wrap:wrap;gap:10px}
.jam-wall span{border:3px solid var(--yel);border-radius:8px;padding:6px 12px;font-weight:700}
.jam-wall .jam-empty{border-style:dashed;opacity:.5}
@media(prefers-reduced-motion:reduce){.jam-blink{animation:none}}
/* Home: Independent Projects card (extends the Game Jam look) */
.pj{padding:36px 32px;border-top:14px solid var(--cy)}
.pj h2{color:var(--cy);text-shadow:3px 3px 0 var(--bl);font-size:clamp(2rem,6vw,3.4rem)}
.pj .jam-blink{color:var(--cy)}
.pj .jam-steps div,.pj .jam-wall span{border-color:var(--cy)}
.pj .jam-steps b{color:var(--cy)}
@media(max-width:600px){.pj{padding:22px 16px}}
/* About page: interactive pillars */
/* Pillars (About page), chips, info boxes, progress bars */
.pil{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;border:3px solid var(--dk);border-radius:10px;box-shadow:5px 5px 0 var(--dk);padding:18px;transition:transform .15s ease,box-shadow .15s ease}
.pil:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--dk)}
.pil[aria-pressed="true"]{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--dk)}
.pil small{display:block;margin-top:8px;font-weight:700}
.pil:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--bl);outline-offset:3px}
.pp.open{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chip{border:3px solid var(--dk);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:6px 14px;cursor:pointer;margin:4px 6px 4px 0;box-shadow:3px 3px 0 var(--dk)}
.chip[aria-pressed="true"]{background:var(--yel);color:#17171d}
.info{background:var(--soft);border:3px dashed var(--dk);border-radius:10px;padding:14px;margin-top:12px}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.slot{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;border:3px dashed var(--dk);border-radius:10px;opacity:.35;transition:opacity .2s,background .2s}
.slot.on{opacity:1;border-style:solid;background:var(--yel);box-shadow:3px 3px 0 var(--dk)}
.bar{height:16px;border:3px solid var(--dk);border-radius:10px;overflow:hidden;background:var(--soft);max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .3s}
#rx{width:100%;padding:28px 14px;font-size:1.3rem;margin:12px 0 6px}
.dbwrap{display:flex;justify-content:center;margin:12px 0;padding:0;height:auto;overflow:visible}
dbox-widget{display:block;width:100%;max-width:560px;margin:0 auto}
dbox-widget iframe{max-width:100%!important;border:0}
button.tag{font:inherit;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--dk);transition:transform .15s ease}
button.tag:hover{transform:translate(-2px,-2px)}
button.tag[aria-pressed="true"]{background:var(--pc);color:var(--pf);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--dk)}
button.tag:focus-visible{outline:3px solid var(--bl);outline-offset:3px}
.pp{scroll-margin-top:90px}
@media(prefers-reduced-motion:reduce){button.tag{transition:none}}
@media(prefers-reduced-motion:reduce){.pp.open{animation:none}.pil,.slot,.bar i{transition:none}}

/* Donate page: payment option cards */
.dn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;align-items:start;margin:14px 0 28px}
.dn>article{border:3px solid var(--dk);border-radius:12px;box-shadow:5px 5px 0 var(--dk);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow-wrap:anywhere;background:var(--card)}
.dn>article h3{margin:0}
.dn>article p{margin:0}
.dn .a-pp{border-top:12px solid var(--bl)}
.dn .a-db{border-top:12px solid var(--cy)}
.dn .a-upi{border-top:12px solid var(--or)}
.dn .a-bk{border-top:12px solid var(--red)}
.dn small.mu{font-size:.9rem}
.dn-st{font-size:.9rem;min-height:1.3em}
.dn-hero{border:4px solid var(--dk);border-radius:14px;box-shadow:8px 8px 0 var(--dk);border-top:14px solid var(--or);padding:24px 20px;margin:20px auto 32px;max-width:640px;text-align:center;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:12px}
.dn-hero h2,.dn-hero p{margin:0}
.dn-hero .upi{font-size:1.6rem;margin:0;width:100%;max-width:440px;text-align:center}
.dn-hero .dn-qr img{width:min(100%,260px)}

<p><button class="btn" type="button" onclick="document.getElementById('indp-form').scrollIntoView({behavior:'smooth'})">📨 Submit your project</button><a class="btn cy" href="${INDP.guide}" target="_blank" rel="noopener">📘 Contributor guide (PDF)</a></p></div>
<h2 class="m">Projects from the community</h2>${INDP.list.length?`<div class="grid" style="margin-bottom:36px">${INDP.list.map(indpCard).join('')}</div>`:`<div class="card"><p><b>No projects listed yet. Yours could be the first.</b></p></div>`}
<h2 class="m">What counts</h2><div class="grid" style="margin-bottom:36px"><div class="box"><h3 class="m">Simulation</h3>Imitates how a real system behaves over time. Projectile motion with drag, a random walk, heat flow in a rod.</div><div class="box"><h3 class="m">Interactive model</h3>Has controls that show how results change. An Ohm's law explorer, a Fourier series builder, a sorting visualiser.</div><div class="box"><h3 class="m">Visualisation</h3>Turns data or a concept into a picture you can explore. A graph theory visualiser, a phase portrait, an orbit viewer.</div><div class="box"><h3 class="m">Downloadable toolkit</h3>Notebooks or files shared through Drive to run locally. A Jupyter series on numerical methods.</div></div>
<div class="card"><h2 class="m">How to submit</h2><p>Fill in the form with your name, institution, project title, STEM area, a short description, your link, the link type and a contact email (never shown publicly). Then pick the kind of link that suits your project:</p>
<div class="grid"><div class="box"><span class="badge" style="background:var(--yel)">Repository</span><p>A public GitHub, GitLab or Codeberg repo with a README that explains what it is and how to run it.</p></div><div class="box"><span class="badge" style="background:var(--cy)">Hosted website</span><p>A page on GitHub Pages, Netlify or similar. It must open without a login and work on a phone.</p></div><div class="box"><span class="badge" style="background:var(--or)">Drive media</span><p>A folder or zip set to "anyone with the link", downloadable, with a README or short guide.</p></div></div>
<h3 class="m" style="margin-top:24px">What happens next</h3><ol><li><b>Review.</b> A reviewer opens your link and checks it against the guidelines.</li><li><b>Feedback.</b> If something needs fixing, you get friendly, specific suggestions. This is not a rejection.</li><li><b>Listed.</b> Once approved, your project appears on this page.</li><li><b>Kept current.</b> If a link breaks, we contact you before removing it.</li></ol>
<h3 class="m">Before you submit</h3><ul><li>It is a simulation or interactive model related to STEM.</li><li>Your link is public and opens when you are signed out.</li><li>A README or short guide says what it is and how to use it.</li><li>It is your own work, or third-party material is credited (and any AI tool's terms allow sharing).</li><li>No malware, tracking, ads or required sign-ins. It must be suitable for school students.</li></ul>
<p>You keep your copyright and choose your own licence. By submitting you let us list your name, institution, title and link. Please do not use Yantrika or IACS logos to suggest official endorsement.</p>
<p><button class="btn" type="button" onclick="document.getElementById('indp-form').scrollIntoView({behavior:'smooth'})">📨 Submit your project</button><a class="btn cy" href="${INDP.guide}" target="_blank" rel="noopener">📘 Read the full guide</a><a class="btn" href="mailto:${INDP.mail}">Questions? Email us</a></p></div>
<div class="card fm"><h2 class="m">📨 Submit your project</h2><p>Fill this in and press Submit. All fields are required.</p>
<form id="indp-form" novalidate>
<label>Full name<input name="name" required maxlength="80" autocomplete="name"></label>
<label>Affiliated institution<input name="inst" required maxlength="120" placeholder="School, college, university, or Independent contributor"></label>
<label>Project title<input name="title" required maxlength="50" placeholder="Short and clear, under 50 characters"></label>
<label>STEM area<select name="area" required><option value="">Choose one...</option>${INDP_AREAS.map(a=>`<option>${esc(a)}</option>`).join('')}</select></label>
<label>Short description<textarea name="desc" required rows="4" maxlength="500" placeholder="What does it simulate or model, and what can a visitor do with it? (2-3 sentences)"></textarea></label>
<label>Project link<input name="link" type="url" required placeholder="https://"></label>
<label>Link type<select name="type" required><option value="">Choose one...</option>${INDP_TYPES.map(a=>`<option>${esc(a)}</option>`).join('')}</select></label>
<label>Contact email<input name="email" type="email" required autocomplete="email" placeholder="Never shown publicly"></label>
<label class="ck"><input name="declare" type="checkbox" required> This project is my own work, or any third-party material is credited, and I am happy for Yantrika to link to it.</label>
<input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<button class="btn" type="submit">Submit</button>
<p id="indp-st" aria-live="polite"></p>
</form></div>`,

// ================================================================
// EVENT PAGE  (what you see at #/<event-id>)
//   docs(e)   -> "Documents" box: every MAT item whose ev includes this event
//   poster(e) -> poster image, falls back to a coloured card if the file is missing
//   evPage(e) -> full page: status, date, text, photos/poster, documents, related games
// ================================================================
const ix=e=>EV.indexOf(e);
const docs=e=>{const m=MAT.filter(x=>x.ev&&x.ev.includes(e.id));return m.length?`<h3 class="m" style="margin-top:28px">Documents</h3><div class="grid">${m.map(x=>`<a class="box" href="${x.u}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="badge" style="background:var(--yel)">${x.k}</span><h3 class="m" style="margin:8px 0 2px">${esc(x.t)}</h3>${esc(x.d)}</a>`).join('')}</div>`:''};
const poster=e=>`<div class="poster has" style="background:${PC[ix(e)%6]}"><img src="posters/${e.id}.png" alt="${esc(e.t)} poster" onerror="this.parentNode.classList.remove('has');this.parentNode.innerHTML='<div class=m>YANTRIKA</div><h2 class=m>${esc(e.t)}</h2><div><b>${e.d}</b><br>RSA, IACS Kolkata</div>'"></div>`;

function evPage(e){
 let b='';
 if(e.s==='done'){const pics=e.p||Array.from({length:e.n||0},(_,i)=>`images/${e.id}-${i+1}.jpg`);b=`<h3 class="m">Photos</h3><div class="gal">${pics.map((u,i)=>`<img src="${u}" alt="${esc(e.t)} photo ${i+1}" onerror="this.outerHTML='<div class=ph>Image ${i+1} missing</div>'">`).join('')}</div>`;}
 else b=`<h3 class="m">Event Poster</h3>${poster(e)}`;
 const n=EV[ix(e)+1],p=EV[ix(e)-1];
 return `<p><a class="btn" href="#/events">&larr; All events</a></p><div class="card"><span class="badge ${ST[e.s][1]}">${ST[e.s][0]}</span><h1 class="m">${esc(e.t)}</h1><p><b>${e.d}</b> | Yantrika, RSA, IACS Kolkata</p><p>${esc(e.x)}</p>${b}${docs(e)}${GM.filter(g=>g.ev.includes(e.id)).length?`<h3 class="m" style="margin-top:28px">Games that prepare you for this</h3>${GM.filter(g=>g.ev.includes(e.id)).map(g=>`<button class="btn cy" type="button" data-g="${g.id}">${g.i} ${esc(g.t)}</button>`).join('')}`:''}</div><p>${p?`<a class="btn" href="#/${p.id}">&larr; ${esc(p.t)}</a>`:''}${n?`<a class="btn" href="#/${n.id}">${esc(n.t)} &rarr;</a>`:''}</p>`;
}

// Materials page: builds the cards and the live search box
function mats(){
 const g=document.getElementById('mg'),q=document.getElementById('q');
 const d=()=>{const s=q.value.toLowerCase();g.innerHTML=MAT.filter(m=>(m.t+m.d+m.k).toLowerCase().includes(s)).map(m=>`<a class="box" href="${m.u}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="badge" style="background:var(--yel)">${m.k}</span><h3 class="m" style="margin:8px 0 2px">${esc(m.t)}</h3>${esc(m.d)}</a>`).join('')||'<b>Nothing matches that.</b>';};
 q.oninput=d;d();
}

/* ---------- Games Arcade: registry (2-3 games per pillar, each tied to events) ---------- */
// ================================================================
// GAMES  (each game is one function below that draws into element el)
// ================================================================
const PCOL={learn:'var(--red)',build:'var(--bl)',compete:'var(--or)',share:'var(--cy)'};
const evL=ids=>ids.map(id=>{const e=EV.find(x=>x.id===id);return `<a class="btn" href="#/${id}">${esc(e.t)} (${e.d})</a>`}).join('');
let pendG=null;
// The games, thumbnails, theory text and demos are filled in by games/*/game.js (see games/README.md)
const GM=YK.games,GI=YK.thumbs,TH=YK.theory,TI=YK.demos;

const gameSlider=()=>{const set=GM.map(g=>{const p=PIL.find(x=>x.k===g.p);return `<button class="gsc" type="button" data-g="${g.id}" style="--c:${p.c}"><img src="${GI[g.id]}" alt="${esc(g.t)}" loading="lazy" onerror="this.remove()"><div class="lb"><em style="background:${p.c};color:${p.f}">${p.t}</em><b>${esc(g.t)}</b><small>${esc(g.d)}</small></div></button>`}).join('');return `<div class="gs"><div class="gst">${set}${set}</div></div>`;};

/* Pillar buttons (home + about) open the Games page, pre-filtered to that pillar */
// Pillar buttons (home + about) open the Games page filtered to that pillar
let pendF=null;
function pillars(){
 document.querySelectorAll('[data-k]').forEach(b=>{
  b.onclick=()=>{pendF=b.dataset.k;location.hash='#/games';};
 });
}

// ---- Games page: filter chips, game list, full-screen game panel ----
let closeGame=()=>{};
addEventListener('keydown',e=>{if(e.key==='Escape')closeGame();});
// gamesPage(): draws the filter + game cards and opens a game full-screen
function gamesPage(){
 const gf=document.getElementById('gf'),gg=document.getElementById('gg'),gp=document.getElementById('gp');
 let f=pendF||'all',cur=null;pendF=null;
 const cards=()=>{
  gf.innerHTML=[['all','All ('+GM.length+')'],...PIL.map(p=>[p.k,p.t+' ('+GM.filter(g=>g.p===p.k).length+')'])].map(x=>`<button class="chip" type="button" data-f="${x[0]}" aria-pressed="${x[0]===f}">${x[1]}</button>`).join('');
  gg.innerHTML=GM.filter(g=>f==='all'||g.p===f).map(g=>`<button class="pdo gpn" type="button" data-play="${g.id}" aria-pressed="${g.id===cur}" style="border-left:12px solid ${PCOL[g.p]}"><div class="gim" style="background:${PCOL[g.p]}"><img src="${GI[g.id]}" alt="${esc(g.t)} preview" loading="lazy" onerror="this.remove()"></div><div class="gtx"><span>${g.i}</span><span class="badge" style="background:${PCOL[g.p]};color:#fff;float:none;font-size:.8rem;margin-bottom:6px">${g.p.toUpperCase()}</span><br><b>${esc(g.t)}</b><br>${esc(g.d)}<br><small>🔗 ${g.ev.map(id=>esc(EV.find(e=>e.id===id).t)).join(' · ')}</small></div></button>`).join('');
  gf.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;cards();});
  gg.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>open(b.dataset.play));
 };
 const open=id=>{
  const g=GM.find(x=>x.id===id);if(!g)return;cur=id;
  if(f!=='all'&&g.p!==f)f='all';
  cards();
  gp.hidden=false;
  gp.innerHTML=`<div class="gbar"><a class="logo m" href="#/"><img src="images/old_text.png" alt="YANTRIKA" onerror="this.replaceWith(document.createTextNode('YANTRIKA'))"></a><span class="badge" style="background:${PCOL[g.p]};color:#fff;margin-right:auto">${g.i} ${esc(g.t)}</span><a class="btn" href="${YK.srcUrl(g.id)}" target="_blank" rel="noopener" title="Read this game's source code">&lt;/&gt; Source</a><button class="btn cy" type="button" id="gfs">⛶ Full screen</button><button class="btn" type="button" id="gx">✕ Close</button></div><div id="gb" style="margin-top:8px"></div>${TH[g.id]?`<div class="info th"><h3 class="m">🎓 The theory behind it</h3>${TH[g.id]}<div id="ti"></div></div>`:''}<hr style="border:0;border-top:4px dashed var(--dk);margin:24px 0 16px"><h3 class="m">Events this game prepares you for</h3><p>${evL(g.ev)}</p>${YK.srcStrip(g)}`;
  // a broken game must not take the page down with it
  try{g.run(gp.querySelector('#gb'));}catch(err){console.error(err);gp.querySelector('#gb').innerHTML='<div class="info"><b>This game hit an error.</b> Please <a href="'+YK.bugUrl(g.id)+'" target="_blank" rel="noopener">report it</a> or try again.</div>';}
  try{if(TI[g.id]&&gp.querySelector('#ti'))TI[g.id](gp.querySelector('#ti'));}catch(err){console.error(err);}
  gp.classList.remove('open');void gp.offsetWidth;gp.classList.add('open');
  gp.classList.add('gfull','gbgi');gp.style.setProperty('--gimg','url("'+GI[g.id]+'")');document.body.style.overflow='hidden';gp.scrollTop=0;
  gp.querySelector('#gx').onclick=closeG;
  gp.querySelector('#gfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(gp.requestFullscreen)gp.requestFullscreen().catch(()=>{});};
  if(gp.requestFullscreen&&!document.fullscreenElement)gp.requestFullscreen().catch(()=>{});
  gp.querySelector('#gx').focus({preventScroll:true});
 };
 const closeG=()=>{
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  gp.classList.remove('gfull','gbgi','open');gp.style.removeProperty('--gimg');gp.hidden=true;gp.innerHTML='';document.body.style.overflow='';cur=null;cards();
 };
 closeGame=()=>{if(!gp.hidden)closeG();};
 cards();
 if(pendG){const id=pendG;pendG=null;setTimeout(()=>open(id),60);}
}

/* Donorbox widget: load the script once; the dbox-widget element upgrades when it appears */
// Loads the Donorbox donate widget (only on the Donate page)
function donorbox(){
 if(document.getElementById('dbx-js'))return;
 const s=document.createElement('script');
 s.id='dbx-js';s.type='module';s.async=true;s.src='https://donorbox.org/widgets.js';
 document.head.append(s);
}

// Donate page: copy buttons, PayPal hosted button, Donorbox
async function cp(v,b){
 const o=b.textContent;
 try{await navigator.clipboard.writeText(v);b.textContent='Copied!';}
 catch(e){prompt('Copy this text:',v);}
 setTimeout(()=>{b.textContent=o;},1500);
}
function donateInit(){
 donorbox();
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>cp(b.dataset.copy,b));
 const all=document.getElementById('dn-all');
 if(all)all.onclick=()=>cp(DON.bank.map(b=>b[0]+': '+b[1]).join('\n'),all);
 const fail=()=>{
  const j=document.getElementById('pp-js');if(j)j.remove();
  const c=document.getElementById('pp-box'),s=document.getElementById('pp-st');if(!c)return;
  c.innerHTML='<a class="btn" href="mailto:'+LINKS.mail+'">Email us for PayPal assistance</a>';
  s.textContent='PayPal could not load. Please use the email link or another payment option.';
 };
 const draw=()=>{
  const c=document.getElementById('pp-box');if(!c)return;
  try{c.replaceChildren();window.paypal.HostedButtons({hostedButtonId:DON.paypalId}).render('#pp-box');}
  catch(e){fail();}
 };
 let s=document.getElementById('pp-js');
 if(window.paypal&&window.paypal.HostedButtons)draw();
 else if(s){s.addEventListener('load',draw);s.addEventListener('error',fail);}
 else{s=document.createElement('script');s.id='pp-js';s.src=DON.paypalSdk;s.async=true;s.onload=draw;s.onerror=fail;document.head.append(s);}
}

// Promo video: autoplay when visible, pause when scrolled away, mute button
function promo(){
 const v=document.getElementById('pv'),b=document.getElementById('pm');
 if(!v)return;
 b.onclick=()=>{v.muted=!v.muted;b.innerHTML=v.muted?'&#128263; Unmute':'&#128266; Mute';if(v.paused)v.play().catch(()=>{});};
 new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){v.play().catch(()=>{})}else{v.pause()}}),{threshold:.25}).observe(v);
}

// Independent Projects form: validate, then send to INDP.endpoint or open an email
function projInit(){
 const f=document.getElementById('indp-form'),st=document.getElementById('indp-st');if(!f)return;
 const say=(m,ok)=>{st.textContent=m;st.style.color=ok?'':'var(--red)';};
 f.onsubmit=async ev=>{
  ev.preventDefault();
  if(f.website.value)return;
  let bad=null;
  [...f.elements].forEach(x=>{if(x.name&&x.name!=='website'){const v=!x.checkValidity();x.classList.toggle('bad',v);if(v&&!bad)bad=x;}});
  if(bad){say('Please complete the highlighted field.');bad.focus();return;}
  const body=INDP_F.map(a=>{const x=f.elements[a[0]];return a[1]+': '+(x.type==='checkbox'?(x.checked?'Yes':'No'):x.value.trim());}).join('\n');
  const mail=()=>{
   location.href='mailto:'+INDP.mail+'?subject='+encodeURIComponent('Independent Project submission: '+f.title.value.trim())+'&body='+encodeURIComponent(body);
   st.innerHTML='Your email app should open with everything filled in. Just press send. If nothing opened, copy the details and email them to <a href="mailto:'+INDP.mail+'">'+INDP.mail+'</a>. ';
   const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Copy details';b.onclick=()=>cp(body,b);st.append(b);st.style.color='';
  };
  if(INDP.endpoint){
   say('Sending...',true);
   try{
    const q=new URLSearchParams();INDP_F.forEach(a=>{const x=f.elements[a[0]];q.set(a[0],x.type==='checkbox'?(x.checked?'Yes':'No'):x.value.trim());});
    // no-cors: works with Google Apps Script and similar; the reply cannot be read, so success means it was sent
    await fetch(INDP.endpoint,{method:'POST',mode:'no-cors',body:q});
    f.reset();say('Thank you! Your project has been received. A reviewer will be in touch by email.',true);}
   catch(e){mail();}
  }else mail();
 };
}

// Join form: validate, then send to JOIN.endpoint or open an email
function joinInit(){
 const f=document.getElementById('join-form'),st=document.getElementById('join-st');if(!f)return;
 const say=(m,ok)=>{st.textContent=m;st.style.color=ok?'':'var(--red)';};
 const val=n=>{const x=f.elements[n];return x.type==='checkbox'?(x.checked?'Yes':'No'):x.value.trim();};
 f.onsubmit=async ev=>{
  ev.preventDefault();
  if(f.elements.website.value)return;
  let bad=null;
  [...f.elements].forEach(x=>{if(x.name&&x.name!=='website'){const v=!x.checkValidity();x.classList.toggle('bad',v);if(v&&!bad)bad=x;}});
  if(bad){say('Please complete the highlighted field.');bad.focus();return;}
  const body=JOIN_F.map(a=>a[1]+': '+(val(a[0])||'-')).join('\n');
  const mail=()=>{
   location.href='mailto:'+JOIN.mail+'?subject='+encodeURIComponent('Join Yantrika: '+val('name'))+'&body='+encodeURIComponent(body);
   st.innerHTML='Your email app should open with everything filled in. Just press send. If nothing opened, copy the details and email them to <a href="mailto:'+JOIN.mail+'">'+JOIN.mail+'</a>. ';
   const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Copy details';b.onclick=()=>cp(body,b);st.append(b);st.style.color='';
  };
  if(JOIN.endpoint){
   say('Sending...',true);
   try{
    const q=new URLSearchParams();q.set('form','join');JOIN_F.forEach(a=>q.set(a[0],val(a[0])));
    await fetch(JOIN.endpoint,{method:'POST',mode:'no-cors',body:q});
    f.reset();say('Thank you! We have received your details and will be in touch by email.',true);}
   catch(e){mail();}
  }else mail();
 };
}

// ================================================================
// ROUTER: runs on every page change (address bar #/...)
//   1. work out which page / event is wanted
//   2. draw the top nav (header logo text is edited on the nav line below)
//   3. draw the page, then switch on that page's interactive parts
// ================================================================
function r(){
 const id=location.hash.replace('#/','')||'home';
 const e=EV.find(x=>x.id===id);
 const p=V[id]?id:(e?'events':'home');
 document.getElementById('nav').innerHTML=`<a class="logo m" href="#/">${YLOGO.img('black')}<span>YANTRIKA</span></a><div class="nl" id="nl">${PAGES.map(x=>`<a class="l ${x[0]===p?'on':''}" href="#/${x[0]==='home'?'':x[0]}">${x[1]}</a>`).join('')}</div><button class="btn" id="th" type="button" aria-label="Toggle theme">◐</button><button class="btn" id="mb" type="button" aria-label="Menu" aria-expanded="false">☰</button>`;
 (function(){const nl=document.getElementById('nl'),mb=document.getElementById('mb');mb.onclick=()=>{const o=nl.classList.toggle('open');mb.setAttribute('aria-expanded',o);mb.textContent=o?'✕':'☰';};nl.querySelectorAll('a').forEach(a=>a.onclick=()=>{nl.classList.remove('open');});})();
 document.getElementById('app').innerHTML=(e&&!V[id])?evPage(e):V[p]();
 document.getElementById('bgal').innerHTML=(p==='home'&&!e)?gal():'';
 document.getElementById('th').onclick=()=>{const R=document.documentElement;const isDark=getComputedStyle(R).getPropertyValue('--bg').trim()==='#101015';R.setAttribute('data-theme',isDark?'light':'dark');};
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{pendG=b.dataset.g;location.hash='#/games';});
 if(p==='games')gamesPage();
 if(p==='home'&&!e){promo();}
 if(p==='about'||(p==='home'&&!e))pillars();
 if(p==='donate')donateInit();
 if(p==='materials')mats();
 if(p==='projects')projInit();
 if(p==='join'){joinInit();}
 document.body.style.overflow='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 scrollTo(0,0);
 document.title=(e&&!V[id]?e.t+' | ':p==='home'?'':PAGES.find(x=>x[0]===p)[1]+' | ')+'YANTRIKA';
}
onhashchange=()=>YK.load().then(r);YK.load().then(r);
